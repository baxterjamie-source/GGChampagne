<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Champagne Birthday</title>
<!-- the app's own icon (without these, browsers fall back to the github.io root's favicon, which is another site's) -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- link previews (messages, social): absolute URLs, no dates or reveals -->
<meta property="og:title" content="Steph's Champagne Birthday">
<meta property="og:description" content="🥂">
<meta property="og:type" content="website">
<meta property="og:url" content="https://baxterjamie-source.github.io/GGChampagne/">
<meta property="og:image" content="https://baxterjamie-source.github.io/GGChampagne/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1.09">
</head>
<body>
  <!-- Loading -->
  <section id="loading" class="screen active">
    <div class="loader-bubbles"><span></span><span></span><span></span></div>
    <p id="loading-text">Un instant…</p>
  </section>

  <!-- Bottle: tap 4 times -->
  <section id="bottle-screen" class="screen">
    <div class="bottle-stage">
      <canvas id="bottle-canvas" aria-label="A bottle of Veuve Clicquot Brut, foil off, cork ready."></canvas>
    </div>
  </section>

  <!-- Full-screen canvas for the cork pop, the bubbles and the opening sequence -->
  <canvas id="stage"></canvas>

  <button id="skip" class="skip" hidden>Passer ›</button>
  <div id="rotate-hint" class="rotate-hint" hidden>↻ Tournez votre téléphone · turn your phone sideways</div>
  <button id="sound-hint" class="sound-hint" hidden>🔊 Son activé</button>

  <!-- Menu -->
  <section id="menu" class="screen">
    <header class="menu-head">
      <p class="eyebrow">Steph's</p>
      <h1>Champagne Birthday</h1>
      <p class="sub">June 17 – 23, 2027</p>
    </header>
    <nav class="menu-cards">
      <button class="card card-reveal" data-action="reveal">
        <span class="card-icon">🍾</span>
        <span class="card-title">Cette semaine</span>
        <span class="card-sub" id="next-reveal">This week's reveal</span>
      </button>
      <button class="card card-french" data-action="french">
        <span class="card-icon">🇫🇷</span>
        <span class="card-title">Leçon de français</span>
        <span class="card-sub" id="french-sub">This week's French lesson</span>
      </button>
      <button class="card card-trip" data-action="trip">
        <span class="card-icon">🔒</span>
        <span class="card-title">Le voyage</span>
        <span class="card-sub">Unlocks in June</span>
      </button>
      <button class="card card-replay" data-action="replay">
        <span class="card-icon">🎬</span>
        <span class="card-title">Revoir l'intro</span>
        <span class="card-sub">Replay the opening</span>
      </button>
    </nav>
    <div id="menu-toast" class="menu-toast" hidden></div>
    <p class="ver">GGChampagne v1.09</p><!-- bump with every push, AND the ?v= on every script/style link above, so phones fetch the new files (v1.09: gold glow growing as fewer are left, grammar hints in word order, cards flip back; v1.08: champagne bottle icon and link preview, waiter by the table, water glass fixed, green glow, slow 🐢 voice, cards fit their text, 4 cards moved to word order, À dire filled at once with ? help; v1.07: Lesson 1 in the painted restaurant, new words, poses through the dialogue; v1.06: card buttons Je l'ai ! / Raté ! with missed cards kept in the pile, S & J -7%, side-by-side layout on phones held sideways; v1.05: S & J +20%, arrows step one item at a time, word tiles without punctuation or capitals, side-by-side layout on computers; v1.04: S & J scaled to the waiter, 4 new words, quiz retries with every option explained, word-order slots, step/lesson navigation, Lesson 1 Au restaurant; v1.03: Lesson 0 painted terrace scene with pose swaps; v1.02: cache stamps on the links; v1.01: shots 12 and 14 static, butterfly, swallows, brighter S & J) -->
  </section>

  <!-- French lesson -->
  <section id="lesson" class="screen lesson" aria-label="Leçon de français">
    <header class="lesson-head">
      <button id="lesson-close" class="round home" aria-label="Menu" title="Menu · back to the main menu">⌂</button>
      <span id="lesson-title" class="lesson-title"></span>
      <button id="lesson-music" class="round music" aria-label="Musique" title="Musique · music on/off">♪</button>
      <nav id="lesson-tabs" class="lesson-tabs">
        <button data-tab="lesson" class="on">Leçon</button>
        <button data-tab="sayit">À dire <b id="sayit-count"></b></button>
      </nav>
    </header>
    <nav class="lesson-nav" aria-label="Navigation">
      <button id="nav-prev-lesson" class="nav-btn" aria-label="Leçon précédente · previous lesson" title="Leçon précédente · previous lesson">⏮</button>
      <button id="nav-prev" class="nav-btn" aria-label="Étape précédente · previous step" title="Étape précédente · previous step">‹</button>
      <div id="lesson-steps" class="lesson-steps"></div>
      <button id="nav-next" class="nav-btn" aria-label="Étape suivante · next step" title="Étape suivante · next step">›</button>
      <button id="nav-next-lesson" class="nav-btn" aria-label="Leçon suivante · next lesson" title="Leçon suivante · next lesson">⏭</button>
    </nav>
    <p id="lesson-step-name" class="lesson-step-name"></p>
    <div class="lesson-body">
      <div id="lesson-scene" class="lesson-scene"></div>
      <div class="lesson-side">
        <div id="lesson-panel" class="lesson-panel"></div>
        <div id="lesson-foot" class="lesson-foot"></div>
      </div>
    </div>
  </section>

  <script src="js/core.js?v=1.09"></script>
  <script src="js/scenes.js?v=1.09"></script>
  <script src="js/intro.js?v=1.09"></script>
  <script src="js/lesson_data.js?v=1.09"></script>
  <script src="js/lesson_scenes.js?v=1.09"></script>
  <script src="js/lessons.js?v=1.09"></script>
  <script src="js/main.js?v=1.09"></script>
</body>
</html>
